# Example configuration for g32_telemetry_collector.py
#
# Copy to config.ini, fill in the real values and protect it:
#   cp config.example.ini config.ini
#   chmod 600 config.ini
#
# config.ini is listed in .gitignore and must never be committed.
# Command-line options override the values in this file.

[listener]
# Address and UDP port receiving the MikroTik TZSP stream.
bind = 0.0.0.0
port = 37009

[grill]
# Only accept traffic from this grill (leave empty to accept any source).
ip = 192.168.6.117
# TCP port the G32 uses to talk to the Otto Wilde cloud.
tcp_port = 4501
# Optional four-byte device filter (hex), shown as device_id in the output.
device_id = 84e0422c
# Optional empty-bottle weight in grams; adds estimated_gross_weight_kg.
# tare_weight_g = 9000

[output]
timezone = Europe/Berlin
# Console output format: human = compact one-line text, pretty = indented JSON.
human = false
pretty = false
# Include the raw 50-byte frame in the output.
rawframe = false
# Include network metadata and undecoded fields; log malformed packets.
verbose = false
# Publish "offline" after this many seconds without a frame.
offline_after = 60

[http]
# Serves the latest event as JSON at http://<bind>:<port><path>
enabled = false
bind = 127.0.0.1
port = 8765
path = /g32

[mqtt]
enabled = true
host = 192.168.9.12
port = 1883
topic = openhab/g32/status
# Retained "online"/"offline" state of the collector itself. The broker sets
# it to "offline" automatically (MQTT last will) if the collector dies.
# Leave empty to disable.
availability_topic = openhab/g32/availability
qos = 1
retain = true
client_id = g32-telemetry-collector
username = mqttuser
password = change-me
# Alternative to "password": name of an environment variable holding it.
# password_env = G32_MQTT_PASSWORD
tls = false
